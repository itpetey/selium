[package]
name = "selium-connector-http"
version.workspace = true
edition.workspace = true
description = "HTTP/1.1 edge connector system guest"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = { workspace = true, features = ["std"] }
# getrandom uses the `custom` backend on wasm32 (see `.cargo/config.toml`),
# which forwards to the host `RandomBytes` hostcall via `__getrandom_v03_custom`.
# The `wasm_js`/`wasm32_unknown_unknown_js` browser backends are deliberately
# not used: the guest runtime has no DOM/wasm-bindgen environment.
getrandom = { workspace = true }
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
rustls = { workspace = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { workspace = true, default-features = false, features = ["std"] }
selium-abi.workspace = true
selium-encoding.workspace = true
selium-guest.workspace = true
selium-proto-http.workspace = true
selium-shm.workspace = true
selium-wire.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync"] }
tokio-rustls = { workspace = true, default-features = false }
tracing.workspace = true
web-time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustls-pki-types = { workspace = true, features = ["web"] }

[lints]
workspace = true
