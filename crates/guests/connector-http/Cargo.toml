[package]
name = "selium-connector-http"
version.workspace = true
edition.workspace = true
description = "HTTP/1.1 edge connector system guest"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
selium-abi.workspace = true
selium-encoding.workspace = true
selium-guest.workspace = true
selium-proto-http.workspace = true
selium-shm.workspace = true
selium-wire.workspace = true
tokio = { workspace = true, features = ["io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
