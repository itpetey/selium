[package]
name = "selium-guest"
version.workspace = true
edition.workspace = true
description = "Selium guest SDK"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["macros/tests/ui/*.rs"]

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"], optional = true }
futures = { workspace = true, features = ["std"] }
quinn = { workspace = true, optional = true }
selium-abi.workspace = true
selium-encoding.workspace = true
selium-guest-macros = { path = "macros" }
selium-memory.workspace = true
selium-shm = { workspace = true, optional = true }
selium-wire = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"], optional = true }
tracing.workspace = true
tracing-subscriber = {
  workspace = true,
  features = ["registry"],
  optional = true
}

[dev-dependencies]
selium-memory.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
web-time = { workspace = true }

[features]
default = ["io", "logging"]
axum = ["dep:axum", "io", "tokio/time"]
io = ["dep:selium-shm", "dep:selium-wire", "dep:tokio"]
logging = ["dep:tracing-subscriber"]
quinn = ["dep:quinn", "io"]

[lints]
workspace = true
