[package]
name = "selium-guest"
version.workspace = true
edition.workspace = true
description = "Selium guest SDK"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["macros/tests/ui/*.rs"]

[dependencies]
futures = { workspace = true, features = ["std"] }
selium-abi.workspace = true
selium-encoding.workspace = true
selium-guest-macros = { path = "macros" }
selium-memory.workspace = true
selium-shm.workspace = true
selium-wire.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[dev-dependencies]
selium-memory.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
