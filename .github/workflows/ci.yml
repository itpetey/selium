name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - spine

  pull_request:
    branches:
      - main
      - spine

  # The soak and crash-consistency lanes are too slow for every push; they run
  # nightly (and on demand) through the same gate entry point.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# The verification surface is one aggregate gate: every wasm prerequisite, the
# whole workspace (unit, integration, doc tests, clippy, fmt), the wasm-patch
# guard, spec traceability, the stage-2 wait-word conformance suites, and the
# full ignored pack. It replaces the former check / test / selected-spine
# jobs, so a new ignored test is covered by default rather than by being added
# to a list.
#
# Branch protection must require the `Gate` job's check (see
# docs/verification-gate.md). Required status checks are a repository setting,
# not something this file can assert.

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      # The workspace pins `wasmtiny` (and `ring`/`getrandom`) by git rev, so
      # no sibling checkout is needed; the sibling wasmtiny checkout is kept
      # only because the workspace's patching story in AGENTS.md assumes the
      # two repositories are checked out side by side.
      - uses: actions/checkout@v7
        with:
          path: proto/arch3
      - uses: actions/checkout@v7
        with:
          repository: itpetey/wasmtiny
          path: wasmtiny
          continue-on-error: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # The atomics net-demo and mt-demo prerequisites need nightly + rust-src;
      # scripts/build-all.sh builds them as part of the gate.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # The wasm-patch guard and the shared-memory declaration check read the
      # built modules with wasm-tools.
      - name: install wasm-tools
        run: cargo install wasm-tools --locked --no-default-features --features print
        env:
          RUSTFLAGS: ""

      - name: verification gate
        run: scripts/gate.sh
        working-directory: proto/arch3
        env:
          GATE_REPEAT: "1"

  soak:
    name: Soak and crash-consistency
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          path: proto/arch3
      - uses: actions/checkout@v7
        with:
          repository: itpetey/wasmtiny
          path: wasmtiny
          continue-on-error: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Same entry point as the merge gate; the scheduled lane selects the
      # soak/crash steps and prints their results and the known-unknowns
      # register.
      - name: soak and crash-consistency lanes
        run: scripts/gate.sh --soak-only
        working-directory: proto/arch3
