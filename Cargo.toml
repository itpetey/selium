[workspace]
resolver = "3"
members = [
  "crates/core/abi",
  "crates/core/guest",
  "crates/core/guest/macros",
  "crates/core/kernel",
  "crates/core/runtime",
  "crates/libs/io",
]

[workspace.package]
version = "1.0.0-alpha.6"
edition = "2024"
description = "WASM-based compute and I/O platform for nextgen software stacks"
readme = "README.md"
homepage = "https://selium.com"
repository = "https://github.com/seliumlabs/selium"
license = "MPL-2.0"
keywords = ["data", "etl", "streaming", "wasm", "webassembly"]
categories = ["development-tools", "virtualization", "wasm"]

[workspace.dependencies]
futures = { version = "0.3", default-features = false }
parking_lot = { version = "0.12", default-features = false }
quote = { version = "1.0", default-features = false }
rkyv = { version = "0.8", default-features = false }
selium-abi = { path = "crates/core/abi" }
selium-guest = { path = "crates/core/guest" }
selium-kernel = { path = "crates/core/kernel" }
sha2 = { version = "0.11", default-features = false }
syn = { version = "2.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52", default-features = false }
tracing = { version = "0.1", default-features = false }
wasmtiny = { path = "../../../wasmtiny" }
wat = { version = "1.249", default-features = false }
