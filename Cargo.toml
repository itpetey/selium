[workspace]
resolver = "3"
members = [
  "crates/core/abi",
  "crates/core/guest",
  "crates/core/guest/macros",
  "crates/core/kernel",
  "crates/core/runtime",
  "crates/guests/cluster",
  "crates/guests/discovery",
  "crates/guests/external-api",
  "crates/guests/scheduler",
  "crates/guests/supervisor",
]

[workspace.package]
version = "1.0.0-alpha.6"
edition = "2024"
description = "WASM-based compute and I/O platform for nextgen software stacks"
readme = "README.md"
homepage = "https://selium.com"
repository = "https://github.com/seliumlabs/selium"
license = "MPL-2.0"
keywords = ["data", "etl", "streaming", "wasm", "webassembly"]
categories = ["development-tools", "virtualization", "wasm"]

[workspace.dependencies]
# axum = { version = "0.8", default-features = false }
axum = { path = "../../axum/axum", default-features = false }
futures = { version = "0.3", default-features = false }
parking_lot = { version = "0.12", default-features = false }
# quinn = { version = "0.11", default-features = false }
quinn = { path = "../../quinn/quinn", default-features = false }
quote = { version = "1.0", default-features = false }
rkyv = { version = "0.8", default-features = false }
selium-abi = { path = "crates/core/abi" }
selium-guest = { path = "crates/core/guest" }
selium-kernel = { path = "crates/core/kernel" }
sha2 = { version = "0.11", default-features = false }
syn = { version = "2.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52", default-features = false }
tracing = { version = "0.1", default-features = false }
wasmtiny = { path = "../../../wasmtiny" }
wat = { version = "1.251", default-features = false }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
large_futures = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
panic_in_result_fn = "warn"
rc_mutex = "warn"
string_slice = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
