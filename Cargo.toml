[workspace]
resolver = "3"
members = [
  "crates/core/abi",
  "crates/core/encoding",
  "crates/core/guest",
  "crates/core/guest/macros",
  "crates/core/kernel",
  "crates/core/memory",
  "crates/core/proto-dns",
  "crates/core/proto-http",
  "crates/core/runtime",
  "crates/core/shm",
  "crates/core/wire",
  "crates/guests/connector-dns",
  "crates/guests/connector-http",
  "crates/guests/discovery",
  "crates/guests/discovery-probe",
  "crates/guests/dns-demo",
  "crates/guests/net-demo",
  "crates/guests/spine-demo",
]
# Frozen during the spine rebuild (kept in-tree for later increments):
#   "crates/core/quic"
#   "crates/guests/bridge"
#   "crates/guests/cluster"
#   "crates/guests/external-api"
#   "crates/guests/scheduler"
#   "crates/guests/supervisor"

[workspace.package]
version = "1.0.0-alpha.6"
edition = "2024"
description = "WASM-based compute and I/O platform for nextgen software stacks"
readme = "README.md"
homepage = "https://selium.com"
repository = "https://github.com/seliumlabs/selium"
license = "MPL-2.0"
keywords = ["data", "etl", "streaming", "wasm", "webassembly"]
categories = ["development-tools", "virtualization", "wasm"]

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
blake3 = { version = "1.8", default-features = false }
bytes = { version = "1.12", default-features = false }
clap = { version = "4.6", default-features = false }
flatbuffers = { version = "25.12", default-features = false }
futures = { version = "0.3", default-features = false }
getrandom = { version = "0.4", default-features = false }
parking_lot = { version = "0.12", default-features = false }
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
rkyv = { version = "0.8", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-pemfile = { version = "2", default-features = false }
selium-abi = { path = "crates/core/abi", default-features = false }
selium-encoding = { path = "crates/core/encoding", default-features = false }
selium-guest = { path = "crates/core/guest", default-features = false }
selium-guest-macros = { path = "crates/core/guest/macros", default-features = false }
selium-kernel = { path = "crates/core/kernel", default-features = false }
selium-memory = { path = "crates/core/memory", default-features = false }
selium-proto-dns = { path = "crates/core/proto-dns", default-features = false }
selium-proto-http = { path = "crates/core/proto-http", default-features = false }
selium-shm = { path = "crates/core/shm", default-features = false }
selium-wire = { path = "crates/core/wire", default-features = false }
sha2 = { version = "0.11", default-features = false }
syn = { version = "3.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
trybuild = { version = "1.0", default-features = false }
wasmtiny = { version = "0.1", default-features = false }
wat = { version = "1.258", default-features = false }
web-time = "1.1"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
large_futures = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
panic_in_result_fn = "warn"
rc_mutex = "warn"
string_slice = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[patch.crates-io]
wasmtiny = { path = "../../wasmtiny" }
web-time = { path = "../../web-time" }
